# config.yaml - Giai đoạn 2: Aggressive Learning & Controlled Capacity
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  database_dir: "data/database"
  tickers:
    - "VCB"   # Vietcombank
    - "BID"   # BIDV
    - "CTG"   # VietinBank
    - "TCB"   # Techcombank
    - "MBB"   # MB Bank
    - "VPB"   # VPBank
    - "ACB"   # ACB
    - "STB"   # Sacombank
    - "HDB"   # HDBank
    - "TPB"   # TPBank
  start_date: "2020-01-01"
  batch_size: 32
  delay_between_requests: 2
  delay_between_batches: 10
  delay_between_tickers: 5

features:
  technical:
    - "Open"
    - "High"
    - "Low"
    - "Close"
    - "Volume"
    - "Close_MA7"
    - "Close_MA14"
    - "Close_MA30"
    - "Volatility_14"
    - "Close_to_Open"
    - "High_to_Low"
    - "Close_Pct_Change"
    - "RSI_14"
  fundamental:
    - "ROE (%)"
    - "ROA (%)"
    - "P/E"
    - "P/B"
    - "BVPS (VND)"
    - "ROE_Diff"
    - "P_E_Diff"
    - "PE_to_Close"
  banking_specific:
    - "NIM (%)"
    - "NPL (%)"
    - "CIR (%)"
    - "Provision_Coverage (%)"
    - "Cost_of_Funds (%)"
    - "Equity_Ratio (%)"
    - "Loan_to_Deposit (%)"
    - "Credit_Growth (%)"
    - "Pre_Provision_ROA (%)"
    - "Post_Tax_ROA (%)"
    - "Non_Interest_Income (%)"
    - "Loan_to_Asset (%)"
    - "NPL_to_Asset (%)"
    - "NIM_Diff"
    - "NPL_Diff"
    - "CIR_Diff"
    - "Credit_Growth_Diff"
  market:
    - "Market_Avg_Close"
    - "Market_Volatility"
  direction_threshold: 0.0

training:
  train_split: 0.8
  val_split: 0.1
  timesteps: 30
  scaler_type: "minmax"
  batch_size: 32
  epochs: 120 
  
  # === TINH CHỈNH GIAI ĐOẠN 3 ===
  learning_rate: 0.0005        # Giảm nhẹ lại để tránh dao động quá lớn khi gần đích
  early_stopping_patience: 25
  use_f1_early_stopping: false 
  
  scheduler_patience: 8
  scheduler_factor: 0.5
  scheduler_min_lr: 1e-6
  
  # TĂNG CƯỜNG REGULARIZATION (Chống Overfitting t+60)
  weight_decay_short: 0.001    # Tăng từ 5e-6 -> 1e-3
  weight_decay_long: 0.01      # Tăng cực mạnh từ 5e-5 -> 0.01
  gradient_clip_norm: 1.0
  
  use_focal_loss: false       
  
  loss_weights:
    classification: 1.0
    regression: 0.0

models:
  shared:
    num_classes: 2
    forecast_horizons: 
    sequence_length: 30 
  
  cnn_bilstm:
    hidden_dim: 32      
    num_layers: 2
    kernel_size: 3
    dropout_rate: 0.5   # TĂNG: Chống overfitting mạnh hơn
  
  transformer:
    d_model: 32         
    nhead: 2            # GIẢM: Đơn giản hóa attention để bớt nhiễu
    num_layers: 2       # GIẢM: Trở lại 2 lớp để tránh mô hình quá sâu
    dim_feedforward: 64 # GIẢM: Ép nén thông tin mạnh hơn
    dropout_rate: 0.5   # TĂNG   
    
paths:
  models: "models/"
  processed: "data/processed/"
  database: "data/database/"
  outputs: "outputs/"