# config.yaml - Giai đoạn 2: Aggressive Learning & Controlled Capacity
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  database_dir: "data/database"
  tickers:
    - "VCB"   # Vietcombank
    - "BID"   # BIDV
    - "CTG"   # VietinBank
    - "TCB"   # Techcombank
    - "MBB"   # MB Bank
    - "VPB"   # VPBank
    - "ACB"   # ACB
    - "HDB"   # HDBank
  start_date: "2010-01-01"
  batch_size: 32
  delay_between_requests: 20
  delay_between_batches: 60
  delay_between_tickers: 30

features:
  technical:
    - "Open"
    - "High"
    - "Low"
    - "Close"
    - "Volume"
    - "Close_MA7"
    - "Close_MA14"
    - "Close_MA30"
    - "Volatility_14"
    - "Close_to_Open"
    - "High_to_Low"
    - "Close_Pct_Change"
    - "RSI_14"
  fundamental:
    - "ROE (%)"
    - "ROA (%)"
    - "P/E"
    - "P/B"
    - "BVPS (VND)"
    - "ROE_Diff"
    - "P_E_Diff"
    - "PE_to_Close"
  banking_specific:
    - "NIM (%)"
    - "NPL (%)"
    - "CIR (%)"
    - "Provision_Coverage (%)"
    - "Cost_of_Funds (%)"
    - "Equity_Ratio (%)"
    - "Loan_to_Deposit (%)"
    - "Credit_Growth (%)"
    - "Pre_Provision_ROA (%)"
    - "Post_Tax_ROA (%)"
    - "Non_Interest_Income (%)"
    - "Loan_to_Asset (%)"
    - "NPL_to_Asset (%)"
    - "NIM_Diff"
    - "NPL_Diff"
    - "CIR_Diff"
    - "Credit_Growth_Diff"
  market:
    - "Market_Avg_Close"
    - "Market_Volatility"
  dynamic_neutral_thresholds:
    short_term:
      horizons: [1, 3, 5]
      # TĂNG NGƯỠNG LÊN 0.8% hoặc 1.0%
      # Lý do: Để lọc bớt nhiễu ở t+3, t+5. 
      # t+1 sẽ bị mất nhiều mẫu hơn nhưng tín hiệu còn lại sẽ chất lượng hơn.
      threshold: 0.008  # 0.8%
      
    mid_term:
      horizons: [30]
      # GIỮ NGUYÊN (Đang hoạt động rất tốt)
      threshold: 0.05   # 5%
      
    long_term:
      horizons: [60, 90]
      # HẠ NGƯỠNG XUỐNG 6%
      # Lý do: Để "vớt" lại các mẫu Giảm (Down). 
      # Một quý giảm 6% đã là tín hiệu bán mạnh rồi, không cần đợi đến 10%.
      threshold: 0.06   # 6%

training:
  train_split: 0.8
  val_split: 0.1
  timesteps: 30
  scaler_type: "minmax"
  batch_size: 32
  epochs: 120 
  
  # === REVERT TO PRODUCTION CONFIG ===
  learning_rate: 0.001
  early_stopping_patience: 25
  use_f1_early_stopping: true 
  
  scheduler_patience: 8
  scheduler_factor: 0.5
  scheduler_min_lr: 1e-6
  
  # PRODUCTION REGULARIZATION
  weight_decay_short: 0.0005
  weight_decay_long: 0.001
  gradient_clip_norm: 1.0
  
  use_focal_loss: true       
  use_manual_class_weights: false
  focal_loss_gamma: 1
  
  loss_weights:
    classification: 1.0
    regression: 0.0

models:
  shared:
    num_classes: 2
    forecast_horizons: [1, 3, 5, 30, 60, 90]
    sequence_length: 30 
  
  cnn_bilstm:
    hidden_dim: 64      
    num_layers: 2
    kernel_size: 3
    dropout_rate: 0.3
  
  transformer:
    d_model: 64         
    nhead: 4            
    num_layers: 2       
    dim_feedforward: 128
    dropout_rate: 0.3   
    


models_to_train:
  dl_models:
    - "cnn_bilstm"
    - "transformer"
  baseline_models:
    - "naive"
    
paths:
  models: "models/"
  processed: "data/processed/"
  database: "data/database/"
  outputs: "outputs/"
  temp: "temp_data/"

mlflow:
  artifact_paths:
    plots: "plots"